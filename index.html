<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Water Sales Prediction System</title>
<style>
body{font-family:Arial, sans-serif;background:#eef2f7;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.card{background:white;padding:35px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.1);width:420px}
h2{color:#0d2a54;text-align:center;margin-bottom:5px}
.subtitle{text-align:center;color:#666;font-size:14px;margin-bottom:25px}
label{display:block;font-weight:bold;margin-top:12px;font-size:14px}
input{width:100%;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;background:#f5f5f5}
.btn{width:100%;padding:14px;background:#1a56db;color:white;border:none;border-radius:8px;margin-top:20px;font-size:16px;font-weight:bold;cursor:pointer}
.badge{background:#22c55e;color:white;padding:8px 16px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;margin-top:15px;font-size:13px}
.footer{text-align:center;margin-top:20px;color:#777;font-size:13px}
.error{color:red;background:#fee;padding:10px;border-radius:6px;margin-top:10px;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h2>Water Sales Prediction System Login</h2>
<p class="subtitle">Sign in to access the dashboard and analytics</p>

<form method="GET">
<label>👤 Username</label>
<input type="text" name="username" value="Dhejoker" required>

<label>👤 Name</label>
<input type="text" name="name" value="James" required>

<label>✉️ Email</label>
<input type="email" name="email" value="kyalojames856@gmail.com" required>

<label>🔒 Password</label>
<input type="password" name="password" placeholder="Enter password - Default: James@2026" value="******" required>

<div style="text-align:right;margin-top:8px"><a href="#" style="color:#1a56db;font-size:12px;text-decoration:none">Forgot password?</a></div>

<button type="submit" class="btn">Login</button>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<div style="text-align:center">
<div class="badge">✅ Account Active</div>
</div>

<div class="footer">Summit Technical College - DICT/5955/26<br>James Kyalo - Dhejoker</div>
</form>
</div>
</body>
</html>
